# OneDev CI — off-GPU checks only (contract test + config validation).
# NOTE: validate with `tod build check-spec` on the server side before first
# push; steps share the job workspace, so deps installed in the single
# CommandStep cover both checks (skill rule 4).
version: '1.0'
jobs:
- name: voice-api-ci
  steps:
  - !CheckoutStep
    name: checkout
    cloneDepth: 1
  - !CommandStep
    name: contract-test-and-config-validation
    image: python:3.12-slim
    runInContainer: true
    commands: |
      set -e
      echo '== voice-api v1 contract (reference stub, no GPU/docker)'
      python3 tools/voice_api_contract_test.py
      echo '== bench config validation (all configs, no GPU)'
      pip install --quiet pyyaml
      python3 - <<'EOF'
      import glob, sys, yaml
      from pathlib import Path
      sys.path.insert(0, '.')
      from bench.runner import validate_config
      configs = sorted(glob.glob('bench/configs/*.yaml'))
      assert configs, 'no configs found'
      for f in configs:
          validate_config(yaml.safe_load(Path(f).read_text()))
          print('config OK:', f)
      EOF
