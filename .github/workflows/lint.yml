name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pre-commit builds a venv per hook (shellcheck-py compiles a wheel and
      # pulls the binary from GitHub releases — transient 504s there failed
      # whole runs); cache the envs so only the first run pays.
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit (shellcheck, hadolint, ruff, yaml/json checks)
        run: pre-commit run --all-files
      - name: Actionlint
        uses: reviewdog/action-actionlint@v1
