# Unit tests + the 80% coverage gate (pyproject addopts; the README-repro
# byte-check is a local pre-push ritual — make bench-plot && git diff).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install harness deps + pytest
        run: pip install -q -r bench/requirements.txt pytest pytest-cov
      - name: Unit tests (pure helpers; no GPU, no docker)
        run: python -m pytest
