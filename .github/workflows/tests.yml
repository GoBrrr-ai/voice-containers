# Unit tests + the README-repro contract (README.md is GENERATED — CI fails
# when it does not reproduce from benchmarks/history.jsonl).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness deps + pytest
        run: pip install -q -r bench/requirements.txt pytest
      - name: Unit tests (pure helpers; no GPU, no docker)
        run: python -m pytest

  readme-repro:
    # Byte-stable re-render needs the box class the charts were rendered on
    # (fonts, matplotlib build) -> the jetson self-hosted runner.
    runs-on: [self-hosted, jetson]
    steps:
      - uses: actions/checkout@v4
      - name: Bench venv (bootstrap if the runner lacks it)
        run: |
          test -x bench/.venv/bin/python || python3 -m venv bench/.venv
          bench/.venv/bin/python -m pip install -q -r bench/requirements.txt
      - name: Re-render README + charts from committed data
        run: make bench-plot
      - name: Fail if the generated surfaces drifted
        run: git diff --exit-code -- README.md assets/benchmarks
