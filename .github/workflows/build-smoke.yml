name: build-smoke

# Build + arch-verify the images on hosted arm64 (native aarch64 — the images
# are arm64-only; no cross-arch emulation). Hosted runners have no GPU: the
# GPU smoke suite is a local ritual (make smoke-all / scripts/sweep-smoke.sh
# SMOKE=1); CI stops at the cuobjdump gate.
on:
  workflow_dispatch:
    inputs:
      projects:
        description: "Space-separated project names (empty = all)"
        required: false
        default: ""

jobs:
  build:
    # Cold cache the first time: the shared builders compile from source
    # (parakeet-cpp ~30 min, wheels-cu132 ~75 min), then docker layer-caches
    # for the rest of the dispatch.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build shared builders (cached)
        run: |
          (cd builders/parakeet-cpp && ./build.sh)
          (cd builders/wheels-cu132 && ./build.sh)
      - name: Build engine images
        env:
          PROJECTS: ${{ inputs.projects }}   # via env, never inline into shell
        run: |
          for p in ${PROJECTS:-$(tr '\n' ' ' < scripts/projects.txt)}; do
            echo "== build $p"
            (cd "$p" && ./build.sh)
          done
      - name: Arch verification (cuobjdump)
        run: SMOKE=0 ./scripts/sweep-smoke.sh
