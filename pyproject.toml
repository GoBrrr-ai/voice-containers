# Repo metadata + tool config. The host-side harness deps live in
# bench/requirements.txt (the bench venv consumes that directly); this file
# carries the packaging identity, pytest discovery and a dependabot anchor.
[project]
name = "voice-containers"
version = "0.1.0"
description = "Production container images for NVIDIA Jetson edge GPUs (sm_87/sm_110): a streaming voice stack with a spec-driven benchmark harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mieszko Syty" }]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=bench --cov-report=term --cov-fail-under=80"

[tool.coverage.run]
source = ["bench"]
omit = ["bench/.venv/*"]

[tool.coverage.report]
# The unit suite is pure-CPU by doctrine (no GPU/docker in CI); the gate
# holds the harness honest as it grows. 80 per spec request 2026-11-07.
fail_under = 80
show_missing = false
